<!-- La búsqueda queda montada (oculta) para conservar filtros y página al volver. -->
<div [hidden]="fichaSeleccionada()">
  <app-busqueda-fichas
    anexo="Anexo 04"
    titulo="Ficha de valoración de méritos"
    (seleccionar)="onVerFicha($event)"
  />
</div>

@if (fichaSeleccionada(); as seleccionada) {
  <app-ficha-meritos-vista
    [ficha]="ficha()"
    [error]="errorFicha()"
    [cargando]="cargandoFicha()"
    [descargando]="descargando()"
    [nombre]="seleccionada.nombreCompleto"
    (volver)="onVolver()"
    (descargarPdf)="onDescargarPdf()"
    (reintentar)="onReintentar()"
    (verCarpeta)="onVerCarpeta()"
  />
}
